name: Publish update signature mirror

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to mirror, for example v4.4.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: update-signature-mirror
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release
        id: release
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${EVENT_TAG:-$INPUT_TAG}"
          [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+){1,3}(-[A-Za-z0-9][A-Za-z0-9.-]*)?$ ]]
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download signed release files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir -p /tmp/cloudboost-update
          gh release download "$TAG" --dir /tmp/cloudboost-update \
            --pattern "CloudBoost_v${VERSION}.zip" \
            --pattern "CloudBoost_v${VERSION}.zip.sig" \
            --pattern "CloudBoost_v${VERSION}.dmg" \
            --pattern "CloudBoost_v${VERSION}.dmg.sig"
          test -s "/tmp/cloudboost-update/CloudBoost_v${VERSION}.zip"
          test -s "/tmp/cloudboost-update/CloudBoost_v${VERSION}.zip.sig"
          test -s "/tmp/cloudboost-update/CloudBoost_v${VERSION}.dmg"
          test -s "/tmp/cloudboost-update/CloudBoost_v${VERSION}.dmg.sig"

      - name: Build static mirror
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          DEST="docs/updates/v${VERSION}"
          mkdir -p "$DEST"
          cp "/tmp/cloudboost-update/CloudBoost_v${VERSION}.zip.sig" "$DEST/"
          cp "/tmp/cloudboost-update/CloudBoost_v${VERSION}.dmg.sig" "$DEST/"
          ZIP_SHA="$(sha256sum "/tmp/cloudboost-update/CloudBoost_v${VERSION}.zip" | cut -d' ' -f1)"
          DMG_SHA="$(sha256sum "/tmp/cloudboost-update/CloudBoost_v${VERSION}.dmg" | cut -d' ' -f1)"
          jq -n \
            --arg version "$VERSION" \
            --arg zip_sha "$ZIP_SHA" \
            --arg zip_sig "CloudBoost_v${VERSION}.zip.sig" \
            --arg dmg_sha "$DMG_SHA" \
            --arg dmg_sig "CloudBoost_v${VERSION}.dmg.sig" \
            '{version: $version, zip: {sha256: $zip_sha, signature: $zip_sig}, dmg: {sha256: $dmg_sha, signature: $dmg_sig}}' \
            > "$DEST/manifest.json"
          jq -e --arg version "$VERSION" '.version == $version and (.zip.sha256 | length) == 64 and (.dmg.sha256 | length) == 64' "$DEST/manifest.json"

      - name: Publish mirror files
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/updates
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: mirror update signatures for ${TAG}"
          git push
