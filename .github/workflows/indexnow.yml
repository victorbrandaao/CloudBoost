name: Notify search engines

on:
  workflow_run:
    workflows: ["Deploy public site"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  indexnow:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Submit sitemap URLs to IndexNow
        shell: bash
        run: |
          set -euo pipefail

          key="72cf835d7bfa33f3f807f3d8e98ad3c4"
          host="getcloudboost.site"
          key_location="https://${host}/${key}.txt"
          url_list="$(sed -n 's|.*<loc>\(https://getcloudboost.site/[^<]*\)</loc>.*|\1|p' docs/sitemap.xml | sort -u | jq -R . | jq -s .)"

          payload="$(jq -n \
            --arg host "$host" \
            --arg key "$key" \
            --arg keyLocation "$key_location" \
            --argjson urlList "$url_list" \
            '{host: $host, key: $key, keyLocation: $keyLocation, urlList: $urlList}')"

          curl --fail-with-body \
            --retry 3 \
            --header "Content-Type: application/json; charset=utf-8" \
            --data "$payload" \
            https://api.indexnow.org/indexnow
