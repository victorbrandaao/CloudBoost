<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { display: grid; grid-template-columns: 1.04fr .96fr; background: #f4f4f1; color: #0f1115; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
      .copy { display: flex; flex-direction: column; justify-content: center; padding: 64px 42px 64px 70px; }
      .logo { width: 390px; margin-bottom: 70px; }
      .eyebrow { margin: 0 0 14px; color: #00a884; font-size: 16px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
      h1 { max-width: 570px; margin: 0 0 20px; font-size: 58px; line-height: .98; letter-spacing: 0; }
      p { max-width: 560px; margin: 0; color: #5f5f5f; font-size: 21px; line-height: 1.42; }
      .visual { position: relative; display: grid; place-items: center; background: #0f1115; overflow: hidden; }
      .visual img { width: 430px; transform: translateY(165px); border-radius: 22px; box-shadow: 0 28px 70px rgba(0,0,0,.44); }
      .status { position: absolute; top: 52px; right: 48px; color: #1fdb94; font-size: 15px; font-weight: 800; }
    </style>
  </head>
  <body>
    <section class="copy">
      <img class="logo" src="../assets/brand/cloudboost-logo-v2.svg" alt="CloudBoost">
      <p class="eyebrow">Gaming session diagnostics for macOS</p>
      <h1>Find the spike. Understand the session.</h1>
      <p>Jitter, packet loss, VPN routes, Wi-Fi interference and local Mac pressure in one menu bar app.</p>
    </section>
    <section class="visual">
      <span class="status">macOS 12+ · Free core · $10 PRO</span>
      <img src="../assets/cloudboost-app-session-branded.png" alt="CloudBoost session diagnostics">
    </section>
  </body>
</html>
